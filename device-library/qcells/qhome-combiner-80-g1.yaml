id: qcells-qhome-combiner-80-g1
vendor: Qcells
display_name: Q.HOME COMBINER 80 G1
class: combiner
status: draft
ratings:
  busbar_a: null            # TODO: 모선 정격 확인 (제품명의 80이 무엇을 가리키는지 포함)
ports:
  # PV 스트링(=AC 모듈 분기회로) 최대 4회로
  - { id: pv_ac_in, type: ac_240v_split, direction: in, max_connections: 4 }
  - { id: battery_ac, type: ac_240v_split, direction: bidirectional, max_connections: 4 }
  - { id: main_ac, type: ac_240v_split, direction: bidirectional }
  - { id: comms, type: comms_proprietary, direction: bidirectional, max_connections: 8 }
provides_mid: false
requires_one_of: []
needs_backup_subpanel: "no"
certifications: []
utility_approval: null
internals:
  blocks:
    - { id: busbar, display_name: 모선, kind: busbar, port: null, ocpd_a: null,
        note: "정격 미확인 — 제품명의 80이 모선 정격인지 확인 대상" }
    - { id: pv_breakers, display_name: PV 분기 차단기, kind: breaker, port: pv_ac_in,
        ocpd_a: null, count: 4,
        note: "AC 모듈 데이터시트가 'Q.HOME COMBINER CB : Max 4'로 4자리를 직접 적는다. 정격은 여전히 미확인" }
    - { id: batt_breaker, display_name: 축전지 분기 차단기, kind: breaker, port: battery_ac,
        ocpd_a: null, count: null, note: "자리 수·정격 미확인" }
    - { id: main_breaker, display_name: 메인 차단기, kind: breaker, port: main_ac,
        ocpd_a: null, note: "상류(HUB/패널) 연결. 정격 미확인" }
    - { id: ct, display_name: 소비 계량용 CT, kind: meter, port: comms, count: 2,
        note: "200 A 클램프형 1쌍(정확도 ±0.5%). 전력 경로가 아니라 계측 신호다" }
  links:
    - { from: pv_breakers, to: busbar, domain: ac }
    - { from: batt_breaker, to: busbar, domain: ac }
    - { from: busbar, to: main_breaker, domain: ac }
    - { from: ct, to: busbar, domain: signal }
  sources:
    - ref: "Q.HOME COMBINER 80 G1 설치 매뉴얼"
      url: "https://media.qcells.com/v/J5bKzFB8/"
      date: "2026-09-03"
      note: >-
        'PV 회로 최대 4계통', 'AC 모듈 최대 44장', '소비 계량용 200 A 클램프형 CT 1쌍'에서
        도출한 골격이다. 함체 내부 결선도를 대조한 것이 아니다
    - ref: "Qcells Q.TRON AC MODULE 415-440 데이터시트 AC Output 표 — 사용자가 제공한 지면 이미지에서 전사"
      url: "https://us.qcells.com/wp-content/uploads/2024/09/Qcells_Data_sheet_Q.TRON_AC_MODULE_series_415-440_2024-08_Rev03_NA.pdf"
      date: "2026-09-04"
      note: >-
        'Q.HOME COMBINER CB : Max 4'. PV 분기 차단기 4자리가 매뉴얼의 회로 수와
        별개 문서에서 같은 값으로 나온다 — 정격(A)은 어느 쪽에도 없다
  todos:
    - "차단기 정격(A)을 매뉴얼 내부 결선도로 확인할 것. 자리 수 4는 두 문서가 일치하나 정격은 어느 쪽에도 없다"
    - "축전지 분기가 몇 자리인지 확인 (battery_ac 포트는 최대 4연결이나 차단기 수와 같은지 미확인)"
    - "모선 정격 확인 — 제품명의 80이 무엇을 가리키는지 포함"
sources:
  - ref: "Q.HOME COMBINER 80 G1 설치 매뉴얼"
    url: "https://media.qcells.com/v/J5bKzFB8/"
    date: "2026-09-03"
    note: >-
      PV 회로 최대 4계통, AC 모듈 최대 44장을 한 함체로 모은다.
      소비 계량용 200 A 클램프형 CT 1쌍(정확도 ±0.5%) 지원
todos:
  - "모선·차단기 정격 확인. 제품명의 80이 정격 전류인지 확인"
  - "CT는 계측 신호다 — ct_sense 포트로 분리할지 결정"
