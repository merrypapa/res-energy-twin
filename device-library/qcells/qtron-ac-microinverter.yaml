id: qcells-qtron-ac-microinverter
vendor: Qcells
display_name: Q.TRON AC 내장 마이크로인버터
class: microinverter
status: draft
ratings:
  # AC 모듈의 변환기 부분. 모델명 Q.MI.349B-G1.
  # 데이터시트가 피상전력(VA)으로 적으므로 kW로 옮기지 않는다.
  continuous_ac_kva: 0.349        # 349 VA
  peak_ac_kva: 0.366              # 366 VA
  max_continuous_ac_a: 1.45       # 349 VA / 240 V = 1.454 A
  cec_efficiency_pct: 97
  max_units_per_branch: 11        # 20 A (L-L) 분기회로 기준
ports:
  - { id: dc_in, type: dc_pv_module, direction: in }
  - { id: trunk_in, type: ac_240v_split, direction: in }
  - { id: ac_out, type: ac_240v_split, direction: out }
provides_mid: false
grid_forming: null
black_start_capable: null
requires_one_of: []
needs_backup_subpanel: "no"
certifications: []
utility_approval: null
sources:
  - ref: "Qcells Q.TRON AC MODULE 415–440 데이터시트 (북미)"
    url: "https://us.qcells.com/wp-content/uploads/2024/09/Qcells_Data_sheet_Q.TRON_AC_MODULE_series_415-440_2024-08_Rev03_NA.pdf"
    date: "2026-09-03"
    note: >-
      Q.TRON AC는 모듈에 마이크로인버터를 공장에서 붙인 제품이다. 이 도구는 그 둘을
      노드로 나눠 모듈의 DC 출력을 볼 수 있게 한다 — 실제로는 한 함체이며,
      DC 배선이 현장에 노출되지 않는다는 점이 제품의 특징이다
  - ref: "같은 데이터시트 AC Output Electrical Characteristics (Q.MI.349B-G1) — 사용자가 제공한 지면 이미지에서 전사"
    url: "https://us.qcells.com/wp-content/uploads/2024/09/Qcells_Data_sheet_Q.TRON_AC_MODULE_series_415-440_2024-08_Rev03_NA.pdf"
    date: "2026-09-04"
    note: >-
      피크 366 VA · 연속 349 VA · 정격 출력 전류 1.45 A · 공칭 240 V(211~264) ·
      60 Hz(59.3~60.5), 확장 50~66 Hz · 정격 역률 1.0, 조정 범위 0.85 진상~0.85 지상 ·
      THD <5% · 과전압 등급 III · 야간 소비 60 mW · CEC 효율 97%.
      20 A (L-L) 분기회로당 최대 11대, Q.HOME COMBINER 80 G1당 AC 모듈 최대 44장
      (같은 줄에 'Q.HOME COMBINER CB : Max 4'로 결합반 차단기 상한도 적혀 있다)
todos:
  - "전사한 값이라 PDF 원문과 한 번 더 대조할 것 (검산 통과: 349 VA / 240 V = 1.454 A ≈ 1.45 A)"
  - "모듈과 한 몸이라 실제로는 별도 결선 포인트가 아니다 — 부품 수 비교에서 이 점을 어떻게 셀지 결정"
  - "grid_forming 확인 — HUB G3 조합에서 오프그리드 운전 시 이 변환기가 어떤 역할인지"
