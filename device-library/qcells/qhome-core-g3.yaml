id: qcells-qhome-core-g3
vendor: Qcells
display_name: Q.HOME CORE G3 (A7.6B13.1)
class: ac_battery
status: draft
ratings:
  usable_energy_kwh: 13.1
  continuous_ac_kw: 7.6            # 백업 출력
  lra: null                        # TODO
ports:
  - { id: ac_out, type: ac_240v_split, direction: bidirectional }
  - { id: comms, type: comms_proprietary, direction: bidirectional }
provides_mid: false
grid_forming: true                 # HUB G3와 함께 오프그리드 운전을 이룬다
black_start_capable: null
requires_one_of: [qcells-qhome-hub-g3]
needs_backup_subpanel: "no"
certifications: []
utility_approval: null
internals:
  blocks:
    - { id: cells, display_name: 축전지 셀(LFP), kind: cells, port: null,
        note: "LG에너지솔루션 LFP. 사용 가능 용량은 device.ratings.usable_energy_kwh" }
    - { id: pcs, display_name: 양방향 변환기, kind: converter, port: ac_out,
        note: "AC 결합이므로 충·방전 모두 이 변환기를 지난다. 백업 출력은 device.ratings.continuous_ac_kw" }
    - { id: bms, display_name: 제어·통신부, kind: controller, port: comms, count: null,
        note: "HUB G3와의 협조 제어 경로. 내부 구성은 미확인" }
  links:
    - { from: cells, to: pcs, domain: dc }
    - { from: pcs, to: bms, domain: signal }
  sources:
    - ref: "Qcells Q.HOME CORE G3 제품 페이지 / 브로슈어"
      url: "https://us.qcells.com/qhome-core-g3/"
      date: "2026-09-03"
      note: >-
        AC 결합 ESS이고 LFP 셀을 쓴다는 서술에서 도출한 구조다. 셀 + 양방향 변환기는
        AC 결합 ESS의 정의상 구성이며, 함체 내부 배치도를 대조한 것이 아니다
  todos:
    - "변환기와 셀이 실제로 한 함체인지, 모듈 단위로 분리되는지 확인 (2대 병렬 구성과 관련)"
    - "제어·통신부가 별도 기판인지 변환기에 통합인지 확인"
    - "내부 DC 링크 전압 확인 — 확인되면 블록에 정격을 채운다"
sources:
  - ref: "Qcells Q.HOME CORE G3 제품 페이지 / 브로슈어"
    url: "https://us.qcells.com/qhome-core-g3/"
    date: "2026-09-03"
    note: >-
      AC 결합 ESS. 13.1 kWh에서 시작해 Q.HOME HUB G3 + CORE G3 2대 구성 시 26.24 kWh까지.
      백업 출력 7.6 kW, LG에너지솔루션 LFP 셀, 15년 보증.
      모델명 A7.6B13.1의 A/B가 각각 AC 출력(kW)과 축전 용량(kWh)을 가리킨다
todos:
  - "LRA(모터 기동) 정격 확인"
  - "grid_forming=true는 HUB G3 조합의 오프그리드 운전 표기에서 도출했다. 매뉴얼 문구로 재확인 필요"
  - "2대 병렬 시 연속 출력이 합산되는지 확인 (26.24 kWh는 용량 기준 표기다)"
