ports:
  - { id: dc_in, type: dc_pv_module, direction: in }
  # AC 트렁크를 노드 사이 결선으로 표현한다. trunk_in은 앞 유닛에서 오는 트렁크,
  # ac_out은 자기 출력 + 앞 유닛들의 통과분을 함께 싣는 구간이다.
