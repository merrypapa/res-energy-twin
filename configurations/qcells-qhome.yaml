id: qcells-qhome
vendor: Qcells
display_name: Qcells Q.HOME — AC 결합 (AC 모듈 + COMBINER + HUB + CORE)
status: draft

# Q.HOME은 AC 결합 시스템이다. 모듈마다 마이크로인버터가 붙어 각자 AC를 내고
# 트렁크로 결합반에 모인다. Q.TRON AC는 그 둘을 공장에서 결합한 제품이지만,
# 이 도구는 모듈과 변환기를 노드로 나눈다 — 모듈의 DC 출력이 보여야 하기 때문이다.
# 현장에 DC 배선이 노출되지 않는다는 제품의 특징은 device의 sources에 적혀 있다.
options:
  - id: backup_mode
    label: 백업 구성
    kind: enum
    default: whole_home
    choices:
      - value: "none"
        label: Grid support (백업 없음)
        note: "HUB 없이 결합반이 메인 패널 분기에 물린다. CORE의 requires_one_of를 만족하지 못해 E025가 뜬다"
      - value: partial
        label: 부분 백업
        note: "HUB 부하측에 백업 서브패널을 둔다"
      - value: whole_home
        label: 전체 백업
        note: "서비스 도체 위 Q.HOME HUB G3가 계통을 끊는다"
  - id: pv_module_device
    label: PV 모듈
    kind: enum
    default: qcells-qtron-blk-m-g2
    choices:
      - value: qcells-qtron-blk-m-g2
        label: Q.TRON BLK M-G2+ 440
        note: "Q.TRON AC의 모듈 부분. STC 정격이 들어와 있어 DC 전압·전류와 I–V 곡선이 계산된다"
      - value: generic-pv-module-400w
        label: PV 모듈 400W (모델링 기준)
        note: "전기 정격이 들어 있어 DC 전압·전류까지 계산된다"
  - id: micro_device
    label: 마이크로인버터
    kind: enum
    default: qcells-qtron-ac-microinverter
    choices:
      - value: qcells-qtron-ac-microinverter
        label: Q.TRON AC 내장 마이크로인버터
        note: "모듈과 한 함체다. 변환기는 Q.MI.349B-G1 — 연속 349 VA · 피크 366 VA · CEC 97%"
      - { value: enphase-iq8m, label: "Enphase IQ8M (325 VA)" }
  - id: battery_device
    label: 축전지 모델
    kind: enum
    default: qcells-qhome-core-g3
    choices:
      - { value: qcells-qhome-core-g3, label: "Q.HOME CORE G3 (총 13.12 kWh · 가용 12.46 · 7.6 kW)" }
  - id: pv_modules
    label: 모듈 수
    kind: int
    min: 1
    max: 44
    default: 20
    unit: "장"
    note: "Q.HOME COMBINER 80 G1은 AC 모듈 최대 44장을 받는다"
  - id: branch_size
    label: 분기회로당 모듈
    kind: int
    min: 1
    max: 22
    default: 10
    unit: "장"
    note: >-
      결합반 PV 회로는 최대 4계통이다. 분기당 유닛 상한은 제품마다 다르므로
      여기서 막지 않고 R070이 선택된 마이크로인버터의 정격으로 판정한다
      (Q.TRON AC는 20 A (L-L) 분기 기준 11대)

  - id: battery_units
    label: Q.HOME CORE 대수
    kind: int
    min: 0
    max: 2
    default: 1
    unit: "대"
    note: "HUB G3 + CORE G3 2대 구성에서 총 26.24 kWh (= 2 × 13.12). 실제로 꺼내 쓰는 양은 가용 기준 24.92 kWh다"

nodes:
  - { ref: svc, device: generic-utility-service-200a, label: 유틸리티 서비스 }
  - ref: hub
    device: qcells-qhome-hub-g3
    label: Q.HOME HUB G3 (MID)
    when: { backup_mode: [partial, whole_home] }
  - { ref: msp, device: generic-msp-200a, label: 메인 서비스 패널 200A }
  - ref: sub
    device: generic-backup-subpanel-100a
    label: 백업 서브패널
    when: { backup_mode: [partial] }
  - { ref: comb, device: qcells-qhome-combiner-80-g1, label: Q.HOME COMBINER 80 }
  - { ref: core, device: qcells-qhome-core-g3, device_from: battery_device, label: Q.HOME CORE, count_from: battery_units }
  - ref: pv
    device: qcells-qtron-blk-m-g2
    device_from: pv_module_device
    label: PV
    repeat: { count: pv_modules, chunk: branch_size }
  - ref: mi
    device: qcells-qtron-ac-microinverter
    device_from: micro_device
    label: MI
    repeat: { count: pv_modules, chunk: branch_size }

edges:
  - from: svc.line
    to: hub.grid_in
    when: { backup_mode: [whole_home] }
    conductor: { ocpd_a: 200 }
  - from: hub.load_out
    to: msp.main_lugs
    when: { backup_mode: [whole_home] }
    conductor: { ocpd_a: 200, note: "MID 부하측 — 전 부하가 아일랜드에 포함된다" }
  - from: svc.line
    to: msp.main_lugs
    when: { backup_mode: ["none", partial] }
    conductor: { ocpd_a: 200 }
  - from: msp.branch
    to: hub.grid_in
    when: { backup_mode: [partial] }
    conductor: { ocpd_a: null, note: "백업 경계로 가는 피더" }
  - from: hub.load_out
    to: sub.feed
    when: { backup_mode: [partial] }
    conductor: { ocpd_a: null }

  # ── 모듈 → 내장 마이크로인버터 → 트렁크 → 결합반 ──────────
  - from: pv.dc_out
    to: mi.dc_in
    fanout: pairwise
    conductor: { note: "모듈 단위 DC. 실물은 한 함체 안이라 현장에 DC 배선이 노출되지 않는다" }
  - from: mi.ac_out
    to: mi.trunk_in
    fanout: chain
    conductor: { note: "AC 트렁크 — 하류로 갈수록 유닛 전류가 누적된다" }
  - from: mi.ac_out
    to: comb.pv_ac_in
    fanout: chunk_last
    conductor: { ocpd_a: null, note: "분기회로 종단 → 결합반 차단기" }

  - from: comb.main_ac
    to: msp.branch
    when: { backup_mode: ["none", whole_home] }
    conductor: { ocpd_a: null, note: "부하측 인터커넥션 — 버스바 정격 대비 검토 대상" }
  - from: comb.main_ac
    to: sub.branch
    when: { backup_mode: [partial] }
    conductor: { ocpd_a: null }
  - from: core.ac_out
    to: comb.battery_ac
    fanout: each
    conductor: { ocpd_a: null }

  - { from: core.comms, to: comb.comms, layer: comms, fanout: each }
  - { from: hub.comms, to: comb.comms, layer: comms, when: { backup_mode: [partial, whole_home] } }

presets:
  - id: qcells-qhome-core-g3-whole-home
    display_name: "Q.TRON AC + COMBINER 80 + HUB G3 + CORE G3 — 전체 백업"
    options: { backup_mode: whole_home, pv_modules: 20, branch_size: 10, battery_units: 1,
               pv_module_device: qcells-qtron-blk-m-g2, micro_device: qcells-qtron-ac-microinverter,
               battery_device: qcells-qhome-core-g3 }

sources:
  - ref: "Qcells Q.HOME CORE G3 / Q.TRON AC / Q.HOME COMBINER 공식 페이지 및 문서"
    url: "https://us.qcells.com/qhome-core-g3/"
    date: "2026-09-03"
    note: >-
      백업 구성은 AC 모듈 + AC 결합반 + 축전지 + 백업 유닛(HUB)으로 이뤄진다.
      PDF 원문 열람이 이 환경에서 차단되어 공식 페이지·문서 표기로 확인했다
todos:
  - "HUB G3의 서비스 정격과 전환 방식 확인"
  - "내장 마이크로인버터의 연속 출력이 null이라 클리핑을 판정하지 않는다"
  - "모듈과 변환기를 두 노드로 나눴다 — 부품 수 비교에서 한 함체를 2개로 셀지 결정 필요"
  - "결합반 PV 회로 4계통 한도와 분기당 모듈 수 한도를 매뉴얼에서 확인할 것"
