id: note-mid
applies_to: { class: mid, device: null }
role: 계통과 집을 끊는 접점. 이 접점의 위치가 백업 경계를 정한다.
design_points:
  - title: 접점의 위치가 백업 범위다
    body: >-
      미터 위치에 있으면 그 아래 전부가 아일랜드에 들어온다(전체 백업). 메인 패널 분기
      아래에 있으면 그 아래 서브패널만 들어온다(부분 백업). 같은 장치라도 어디에
      들어가느냐로 결과가 갈린다 — 도면에서 이 노드가 몇 번째 랭크에 있는지가 그 답이다.
  - title: 정전에서 열리고, 복전에서 동기 후 닫힌다
    body: >-
      계통이 사라지면 접점이 열려 아일랜드가 계통 쪽으로 역가압되지 않게 한다.
      복전 시에는 전압·주파수·위상이 맞은 뒤에 닫힌다. 이 도구는 전환 시간과 동기 조건을
      모델링하지 않는다 — 열림/닫힘 두 상태만 계산한다.
    code_ref: "계통 연계 및 아일랜딩 방지 — UL1741 / IEEE 1547 계열, 원문 대조 필요"
  - title: 미터 뒤 설치는 유틸리티 승인 대상이다
    body: >-
      미터 소켓에 들어가는 장치는 계량 설비에 손을 대는 것이라 유틸리티별 승인이 필요하다.
      승인 현황은 시점에 따라 바뀌므로 확인일과 함께 기록해야 한다.
watch_outs:
  - "provides_mid가 null(미확인)인 장치는 엔진이 개방 주체로 쓰지 않는다 — 백업 결과가 실제보다 작게 나온다"
  - "접점 양쪽 포트에 mid_side 표기가 없으면 장치 내부에 경계를 그릴 수 없다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
