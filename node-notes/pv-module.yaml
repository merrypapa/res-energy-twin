id: note-pv-module
applies_to: { class: pv_module, device: null }
role: DC 발전원. 일사와 온도에 따라 동작점이 움직이는 전류원에 가깝다.
design_points:
  - title: 출력은 일사에 비례하고, 전압은 거의 움직이지 않는다
    body: >-
      전류는 일사에 사실상 선형으로 비례하고 전압은 로그로 약하게 따라간다.
      그래서 흐린 날에도 전압은 남고 전류만 줄어든다 — 신호로 보면 DC 레벨은 유지되고
      크기만 작아진다. 이 도구는 전압을 STC 값으로 고정해 계산한다(온도계수 미반영).
    formula: "P = P_STC · (G / 1000), I ≈ I_mp · (G / 1000)"
  - title: 직렬은 전압을 더하고, 병렬은 전류를 더한다
    body: >-
      단선도에서 모듈 사이의 결선이 수평이면 직렬이다. 스트링 전압은 모듈 수에 비례하고
      전류는 어디서나 같다. 스트링을 병렬로 물리면 반대다 — 전압은 그대로, 전류가 더해진다.
      MPPT 입력이 몇 개인지, 각 입력에 몇 스트링을 물릴 수 있는지가 이 배치를 정한다.
    formula: "V_string = n_series · V_mp,  I_array = n_parallel · I_mp"
  - title: 최대 시스템 전압은 저온의 Voc로 정해진다
    body: >-
      Voc는 온도가 내려가면 올라간다. 스트링 길이는 한여름 동작 전압이 아니라
      가장 추운 날 아침의 개방 전압으로 정해진다. 이 도구는 온도 보정을 하지 않으므로
      계산된 스트링 전압은 상온 기준이며 스트링 설계 근거가 될 수 없다.
    formula: "V_oc(T) = V_oc,STC · [1 + β·(T − 25°C)],  β < 0"
    code_ref: "NEC 690.7 계열 — 원문 대조 필요"
  - title: 동작점은 I–V 곡선 위 한 점이다
    body: >-
      MPPT는 이 곡선 위에서 P = V·I가 최대가 되는 점을 찾아 붙잡는다. 곡선의 무릎에서
      벗어나면 전압이 조금만 흔들려도 출력이 크게 떨어진다. 화면의 곡선은 4파라미터
      지수 근사이며 실측이 아니다.
    formula: "P(V) = V · I(V), MPP = argmax P(V)"
watch_outs:
  - "모듈 정격이 null이면 이 지점의 전압·전류는 계산되지 않는다 — 화면 값이 비어 있는 이유다"
  - "급속 차단(rapid shutdown) 요건은 모듈 단위 장치 유무에 따라 갈린다. 조항 원문 대조 필요"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos:
  - "온도계수(β, γ)를 device 스키마에 넣고 저온 Voc 판정을 룰로 만들 것"
