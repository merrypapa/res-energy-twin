id: note-hybrid-inverter-battery
applies_to: { class: hybrid_inverter_battery, device: null }
role: PV의 DC를 직접 받아 변환하고, 같은 함체 안에서 축전지를 충·방전한다.
design_points:
  - title: DC 결합은 변환을 한 번 줄인다
    body: >-
      PV → 축전지 충전 경로에 AC 변환이 끼지 않는다. AC 결합에서는 PV가 한 번 AC로
      나갔다가 축전지에서 다시 DC로 들어간다. 이 도구는 변환 손실을 인버터 통과 1회로만
      계산하므로, 두 방식의 효율 차이를 정량 비교하는 근거로는 쓸 수 없다.
    formula: "P_ac = η · P_dc (통과 1회 가정)"
  - title: 연속 출력이 백업 부하의 상한이다
    body: >-
      아일랜드에서 이 값을 넘는 부하는 성립하지 않는다. 병렬로 유닛을 늘리면 상한도
      더해진다 — 구성에서 유닛 수를 바꾸면 룰 판정이 그대로 따라간다.
    formula: "Σ P_continuous ≥ P_backup_load"
    code_ref: "백업 부하 산정 — 사내 기준 필요"
  - title: 기동 전류(LRA)는 연속 출력과 다른 축이다
    body: >-
      에어컨 압축기처럼 기동 순간 정격의 수 배를 끌어가는 부하는 연속 출력이 충분해도
      기동에 실패할 수 있다. LRA 정격이 별도로 필요한 이유다. 소프트스타트가 붙으면
      조건이 달라지므로 매뉴얼의 조건부 값을 확인해야 한다.
  - title: 아일랜드를 세우는 주체
    body: >-
      grid_forming=true인 장치만 계통 없이 전압·주파수를 세울 수 있다. 이 값이 미확인이면
      엔진은 세우지 못하는 것으로 계산하고 경고를 남긴다 — 확인 전까지 성립을 주장하지 않는다.
watch_outs:
  - "PV 입력 정격(max_pv_dc_kw)과 MPPT 수가 스트링 배치를 제한한다"
  - "블랙스타트(잔량 0에서 PV만으로 기동)는 그리드 포밍과 별개 능력이다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos: []
