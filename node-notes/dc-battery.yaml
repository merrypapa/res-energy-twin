id: note-dc-battery
applies_to: { class: dc_battery, device: null }
role: DC측에 붙는 축전지. 변환기가 없어 스스로 AC를 내지 못한다 — 붙어 있는 인버터가 대신 낸다.
design_points:
  - title: 변환을 한 번 줄인다
    body: >-
      PV → 축전지 충전 경로에 AC 변환이 끼지 않는다. AC 결합에서는 PV가 AC로 나갔다가
      축전지에서 다시 DC로 들어간다. 이 도구는 변환 손실을 통과 1회로만 계산하므로
      두 방식의 효율 차이를 정량 비교하는 근거로는 쓸 수 없다.
    formula: "P_ac = η · P_dc (통과 1회 가정)"
  - title: 출력 한계는 축전지가 아니라 인버터가 정한다
    body: >-
      방전 전력은 연결된 인버터의 변환 용량과 축전지 포트 전류 한도에 함께 걸린다.
      축전지를 더 붙여도 인버터가 그대로면 순간 출력은 늘지 않는다 — 늘어나는 것은 지속 시간이다.
  - title: 아일랜드를 세우는 것은 인버터다
    body: >-
      이 노드의 grid_forming은 false다. 정전에서 축전지가 있어도, 인버터가 전압을 세우지
      못하면 아일랜드는 성립하지 않는다. 엔진은 인버터에 물린 DC 축전지의 잔량을 보고
      그 인버터가 야간에도 출력할 수 있는지 판정한다.
watch_outs:
  - "인버터에 DC 축전지 포트가 없으면 이 조합은 성립하지 않는다 (E022)"
  - "충·방전 한도는 인버터 데이터시트 쪽에 적혀 있는 경우가 많다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos: []
