id: note-main-panel
applies_to: { class: main_panel, device: null }
role: 집 전체의 분기회로가 모이는 모선. 전원이 여기로 백피드되면 버스바 정격 판정이 걸린다.
design_points:
  - title: 버스바는 양쪽에서 먹힌다
    body: >-
      메인 브레이커로 들어오는 전류와 분기에서 백피드되는 전류가 같은 모선을 쓴다.
      그래서 인터커넥션 판정은 인버터 정격만이 아니라 메인 OCPD와 버스바 정격의 조합으로 한다.
    formula: "OCPD_main + OCPD_backfeed ≤ k · I_busbar (k는 조항이 정한다)"
    code_ref: "NEC 705.12(B) 계열 — 원문 대조 필요"
  - title: 백피드 브레이커의 위치가 판정을 바꾼다
    body: >-
      모선 끝(메인 반대편)에 붙이느냐 아니냐로 성립 여부가 달라지는 구성이 있다.
      이 도구는 브레이커의 물리적 위치를 모델링하지 않는다 — 판정은 정격 합산까지만이다.
  - title: 부하 지점이자 계산의 싱크
    body: >-
      신호 계산에서 주택 부하는 이 노드에 걸린다. 부분 백업에서 이 패널이 사선이 되면
      부하는 백업 서브패널로 옮겨가고, 그때의 부하는 백업 부하 합계다.
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
