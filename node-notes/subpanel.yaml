id: note-subpanel
applies_to: { class: subpanel, device: null }
role: 백업 경계 안쪽 부하를 모으는 패널. 부분 백업 구성에서만 등장한다.
design_points:
  - title: 이 패널에 무엇을 옮기느냐가 부분 백업의 전부다
    body: >-
      백업 부하 합계와 최대 모터 기동 전류가 여기서 정해진다. 부하 이설 공사가
      부분 백업의 실제 비용이며, 전체 백업 구성과의 노무 차이가 여기서 갈린다.
  - title: 피더 정격은 서브패널 부하 합계에서 나온다
    body: >-
      상류 MID와 이 패널을 잇는 피더의 OCPD는 백업 부하 합계로 산출한다.
      값이 비어 있으면 아직 산출하지 않은 것이다.
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos: []
