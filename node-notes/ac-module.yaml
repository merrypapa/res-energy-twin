id: note-ac-module
applies_to: { class: ac_module, device: null }
role: 마이크로인버터를 공장에서 붙인 모듈. 밖으로 나오는 것은 AC뿐이라 어레이에 DC 구간이 없다.
design_points:
  - title: DC가 함체 밖으로 나오지 않는다
    body: >-
      모듈과 변환기가 한 몸이라 지붕 위에 고압 DC 구간이 생기지 않는다. 급속 차단 요건을
      모듈 단위로 만족시키는 구성이며, 이 도구에서도 DC 포트가 없어 DC 신호가 계산되지 않는다 —
      값이 비어 있는 것이 오류가 아니라 구조의 결과다.
    code_ref: "급속 차단 요건 — NEC 690.12 계열, 원문 대조 필요"
  - title: 결선과 시공이 AC 한 겹으로 줄어든다
    body: >-
      모듈 1장 = 결선 1점이다. 모듈과 마이크로인버터를 따로 다는 구성보다 부품 수와 결선
      포인트가 줄어든다. 비교표의 설치 부품 수 차이가 여기서 나온다.
  - title: 트렁크 전류는 여전히 누적된다
    body: >-
      분기회로 하나에 매다는 장수는 트렁크 종단 전류와 분기 OCPD 정격이 정한다.
      AC 모듈이라고 이 한도가 사라지지 않는다.
    formula: "I_trunk(k) = Σ(i≤k) I_module,i"
  - title: 계통 추종이 기본이다
    body: >-
      내장 변환기도 마이크로인버터다. 정전에서 기준 전압이 없으면 출력하지 않는다 —
      아일랜드는 축전지(그리드 포밍)가 세운 뒤에야 이 모듈들이 다시 실린다.
watch_outs:
  - "내장 마이크로인버터의 연속 출력이 데이터에 없으면 클리핑(모듈 대비 변환기 과소)을 판정할 수 없다"
  - "모듈의 DC 정격(Vmp/Imp)은 외부로 나오지 않으므로 이 도구가 다루지 않는다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
