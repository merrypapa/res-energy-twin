id: note-microinverter
applies_to: { class: microinverter, device: null }
role: 모듈 1장의 DC를 그 자리에서 240V AC로 바꾼다. 어레이에 DC 구간이 생기지 않는다.
design_points:
  - title: MPPT가 모듈마다 따로 돈다
    body: >-
      한 장이 그늘에 들어가도 나머지가 끌려 내려가지 않는다. 직렬 스트링에서는 가장 나쁜
      모듈이 스트링 전류를 정하지만, 여기서는 손실이 그 모듈 한 장에 갇힌다.
      대신 유닛 수만큼 변환기와 결선 포인트가 늘어난다.
    formula: "P_ac,i = η · V_mp,i · I_mp,i (유닛마다 독립)"
  - title: 트렁크 전류는 하류로 갈수록 누적된다
    body: >-
      AC 트렁크는 유닛들이 매달린 하나의 분기회로다. 결합반에 가까운 구간일수록
      상류 유닛의 전류가 모두 더해져 흐른다. 분기회로당 유닛 수 한도는 이 누적 전류와
      분기 OCPD 정격에서 나온다 — 통신이나 물리적 길이 때문이 아니다.
    formula: "I_trunk(k) = Σ(i≤k) I_unit,i ≈ k · P_unit / (V_LL · PF)"
    code_ref: "분기회로 연속부하 정격 — NEC 210/705 계열, 원문 대조 필요"
  - title: 계통 추종 운전이 기본이고, 아일랜드는 다른 장치가 세운다
    body: >-
      추종 인버터는 기준 전압·주파수가 있어야 출력한다. 정전에서 마이크로인버터만
      남으면 아무것도 나오지 않는다. 축전지(그리드 포밍)가 먼저 아일랜드를 세운 뒤에야
      다시 실린다. 시나리오 엔진이 이 순서를 그대로 계산한다.
  - title: AC 모듈은 이 둘을 공장에서 붙인 것이다
    body: >-
      모듈과 마이크로인버터가 한 함체인 제품(AC 모듈)이 있다. 전기적으로는 여기 있는
      두 노드와 같고, 차이는 현장에 DC 배선이 노출되지 않는다는 점과 결선·시공이
      한 겹으로 줄어든다는 점이다. 이 도구는 둘을 노드로 나눠 그린다 —
      그래야 모듈의 DC 출력을 볼 수 있다.
  - title: 야간에도 AC측은 살아 있고 DC측만 죽는다
    body: >-
      해가 지면 모듈은 발전을 멈추지만 트렁크는 계통(또는 아일랜드)에 물려 있어 활선이다.
      도면에서 DC는 사선, AC는 활선으로 갈리는 것이 정상이다.
watch_outs:
  - "연속 출력·최대 입력 DC 정격이 확인되지 않으면 클리핑(모듈 대비 인버터 과소) 판정을 할 수 없다"
  - "분기회로당 유닛 수는 제조사 한도를 확인해야 한다. 템플릿 기본값은 자리값이다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos:
  - "IQ8 모델별 연속 출력·효율을 채우고 클리핑 룰을 추가할 것"
