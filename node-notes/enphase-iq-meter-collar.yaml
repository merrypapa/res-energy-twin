id: note-enphase-iq-meter-collar
applies_to: { class: null, device: enphase-iq-meter-collar }
role: 미터 소켓에 끼워 MID와 계량을 함께 맡는 장치. 이 제품의 위치가 Enphase 4세대 구성의 차별점이다.
design_points:
  - title: 백업 서브패널과 부하 재배선이 없다
    body: >-
      접점이 미터 위치에 있으므로 메인 패널 아래 전부가 아일랜드에 들어온다.
      부분 백업에서 필요한 부하 이설 공사가 사라진다 — 비교표의 서브패널 항목과
      부품 수 차이가 이 한 가지에서 나온다.
  - title: 유틸리티 승인이 전제 조건이다
    body: >-
      계량 설비에 들어가는 장치라 유틸리티별 승인이 필요하다. 승인 목록은 시점에 따라
      바뀌므로 확인일 없이 인용하면 안 된다. 룰 엔진이 사이트의 유틸리티와 대조해 판정한다.
watch_outs:
  - "승인되지 않은 유틸리티 관할에서는 이 구성 자체가 성립하지 않는다"
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
todos:
  - "승인 유틸리티 목록을 데이터 파일로 분리하고 확인일 필드를 붙일 것"
