id: note-ac-battery
applies_to: { class: ac_battery, device: null }
role: DC 입력 없이 AC로만 물리는 축전지. 결합반이나 패널 분기에서 계통과 만난다.
design_points:
  - title: AC 결합은 PV와 축전지를 분리해 설계할 수 있게 한다
    body: >-
      PV 어레이의 구성과 무관하게 축전지를 나중에 붙이거나 늘릴 수 있다. 대신 PV → 축전지
      충전 경로에 AC 변환이 한 번 더 낀다.
  - title: kVA와 kW를 섞지 않는다
    body: >-
      연속 출력이 kVA로만 기재된 제품이 있다. 역률 가정 없이 kW로 바꿔 적으면 비교표가
      거짓말을 한다 — 이 도구는 두 단위를 분리해 합산하고, 역률은 명시적 가정값으로만 쓴다.
    formula: "P[kW] = S[kVA] · PF (PF는 가정값)"
  - title: 확장은 병렬 접속이다
    body: >-
      유닛을 늘리면 에너지 용량과 연속 출력이 더해진다. 결합반 쪽 회로 수와 통신 구성이
      함께 늘어나므로, 유닛 수를 바꿨을 때 결선 포인트가 몇 개 늘어나는지가 실제 노무 차이다.
sources:
  - ref: "사내 정리 — 회로 일반 성질 및 단선도 관례"
    date: "2026-09"
    note: "제품 스펙이 아니라 회로의 성질이다. 코드 조항은 전부 원문 대조 전(verified=false)"
